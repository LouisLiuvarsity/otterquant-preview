<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Otter Trade - App Layout Prototype</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #0B0B0B;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ===== HEADER ===== */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 24px;
            background: #0B0B0B;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            height: 60px;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header-logo {
            width: 36px;
            height: 36px;
            border-radius: 50%;
        }

        .header-brand {
            font-family: 'Orbitron', sans-serif;
            font-size: 14px;
            font-weight: 600;
            color: #F5B70A;
            letter-spacing: 0.05em;
        }

        .header-nav {
            display: flex;
            align-items: center;
            gap: 24px;
        }

        .nav-placeholder {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.3);
            letter-spacing: 0.1em;
            text-transform: uppercase;
            border: 1px dashed rgba(255, 255, 255, 0.15);
            padding: 8px 20px;
            border-radius: 0;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .user-email {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.7);
            font-weight: 400;
        }

        .logout-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 32px;
            height: 32px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: transparent;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .logout-btn:hover {
            border-color: #F5B70A;
            background: rgba(245, 183, 10, 0.1);
        }

        .logout-btn svg {
            width: 16px;
            height: 16px;
            stroke: rgba(255, 255, 255, 0.7);
            transition: stroke 0.2s ease;
        }

        .logout-btn:hover svg {
            stroke: #F5B70A;
        }

        /* ===== MAIN CONTENT ===== */
        .main-content {
            flex: 1;
            margin-top: 60px;
            margin-bottom: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: calc(100vh - 108px);
        }

        .content-placeholder {
            text-align: center;
            color: rgba(255, 255, 255, 0.2);
        }

        .content-placeholder-icon {
            width: 80px;
            height: 80px;
            border: 2px dashed rgba(255, 255, 255, 0.15);
            margin: 0 auto 16px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .content-placeholder-icon svg {
            width: 32px;
            height: 32px;
            stroke: rgba(255, 255, 255, 0.15);
        }

        .content-placeholder p {
            font-size: 14px;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }

        /* ===== FOOTER ===== */
        .footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 24px;
            background: #0B0B0B;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            height: 48px;
        }

        .footer-left {
            display: flex;
            align-items: center;
            gap: 24px;
        }

        .crypto-ticker {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            cursor: default;
        }

        .crypto-icon {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 10px;
        }

        .crypto-icon.btc {
            background: #F7931A;
            color: #fff;
        }

        .crypto-icon.eth {
            background: #627EEA;
            color: #fff;
        }

        .crypto-icon.sol {
            background: linear-gradient(135deg, #9945FF, #14F195);
            color: #fff;
        }

        .crypto-pair {
            color: rgba(255, 255, 255, 0.9);
            font-weight: 500;
            font-size: 11px;
            letter-spacing: 0.03em;
        }

        .crypto-change {
            font-size: 11px;
            font-weight: 500;
        }

        .crypto-change.negative {
            color: #EF4444;
        }

        .crypto-change.positive {
            color: #22C55E;
        }

        .crypto-price {
            color: rgba(255, 255, 255, 0.7);
            font-size: 11px;
            font-weight: 400;
            font-variant-numeric: tabular-nums;
        }

        .ticker-divider {
            width: 1px;
            height: 16px;
            background: rgba(255, 255, 255, 0.1);
        }

        .footer-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .footer-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 30px;
            height: 30px;
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.1);
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
        }

        .footer-btn:hover {
            border-color: #F5B70A;
            background: rgba(245, 183, 10, 0.1);
        }

        .footer-btn svg {
            width: 15px;
            height: 15px;
            stroke: rgba(255, 255, 255, 0.7);
            transition: stroke 0.2s ease;
        }

        .footer-btn:hover svg {
            stroke: #F5B70A;
        }

        .notification-badge {
            position: absolute;
            top: -3px;
            right: -3px;
            width: 8px;
            height: 8px;
            background: #EF4444;
            border-radius: 50%;
            border: 1.5px solid #0B0B0B;
        }

        .footer-divider {
            width: 1px;
            height: 18px;
            background: rgba(255, 255, 255, 0.1);
        }

        .social-link {
            text-decoration: none;
        }

        .social-link:hover svg path {
            fill: #F5B70A;
        }

        /* ===== LANGUAGE DROPDOWN ===== */
        .lang-dropdown {
            position: absolute;
            bottom: 40px;
            right: 0;
            background: #1A1A2E;
            border: 1px solid rgba(255, 255, 255, 0.1);
            min-width: 180px;
            display: none;
            z-index: 2000;
            box-shadow: 0 -8px 32px rgba(0, 0, 0, 0.5);
        }

        .lang-dropdown.active {
            display: block;
        }

        .lang-option {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 16px;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.8);
            cursor: pointer;
            transition: background 0.15s ease;
        }

        .lang-option:hover {
            background: rgba(245, 183, 10, 0.1);
            color: #F5B70A;
        }

        .lang-option.selected {
            color: #F5B70A;
        }

        .lang-option .check-icon {
            width: 14px;
            height: 14px;
            stroke: #F5B70A;
            display: none;
        }

        .lang-option.selected .check-icon {
            display: block;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 768px) {
            .header {
                padding: 10px 16px;
            }

            .header-brand {
                display: none;
            }

            .nav-placeholder {
                display: none;
            }

            .user-email {
                font-size: 11px;
                max-width: 120px;
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
            }

            .footer {
                padding: 8px 12px;
            }

            .footer-left {
                gap: 12px;
                overflow-x: auto;
            }

            .crypto-ticker {
                gap: 5px;
            }

            .crypto-pair {
                font-size: 10px;
            }

            .crypto-change {
                font-size: 10px;
            }

            .crypto-price {
                font-size: 10px;
            }

            .ticker-divider {
                display: none;
            }
        }

        @media (max-width: 480px) {
            .footer-left {
                gap: 8px;
            }

            .crypto-price {
                display: none;
            }
        }
    </style>
</head>
<body>
    <!-- HEADER -->
    <header class="header">
        <div class="header-left">
            <img src="logo.png" alt="Otter Trade" class="header-logo">
            <span class="header-brand">OTTER TRADE</span>
        </div>

        <nav class="header-nav">
            <span class="nav-placeholder">Navigation TBD</span>
        </nav>

        <div class="header-right">
            <span class="user-email">user@example.com</span>
            <button class="logout-btn" title="Logout">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                    <polyline points="16 17 21 12 16 7"/>
                    <line x1="21" y1="12" x2="9" y2="12"/>
                </svg>
            </button>
        </div>
    </header>

    <!-- MAIN CONTENT -->
    <main class="main-content">
        <div class="content-placeholder">
            <div class="content-placeholder-icon">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="3" width="18" height="18" rx="0"/>
                    <line x1="3" y1="9" x2="21" y2="9"/>
                    <line x1="9" y1="21" x2="9" y2="9"/>
                </svg>
            </div>
            <p>Page Content Area</p>
        </div>
    </main>

    <!-- FOOTER -->
    <footer class="footer">
        <div class="footer-left">
            <!-- Bitcoin -->
            <div class="crypto-ticker">
                <div class="crypto-icon btc">B</div>
                <span class="crypto-pair">BTCUSDT</span>
                <span class="crypto-change negative">-8.83%</span>
                <span class="crypto-price">62,640.0</span>
            </div>

            <div class="ticker-divider"></div>

            <!-- Ethereum -->
            <div class="crypto-ticker">
                <div class="crypto-icon eth">E</div>
                <span class="crypto-pair">ETHUSDT</span>
                <span class="crypto-change negative">-5.21%</span>
                <span class="crypto-price">3,412.5</span>
            </div>

            <div class="ticker-divider"></div>

            <!-- Solana -->
            <div class="crypto-ticker">
                <div class="crypto-icon sol">S</div>
                <span class="crypto-pair">SOLUSDT</span>
                <span class="crypto-change positive">+2.15%</span>
                <span class="crypto-price">142.8</span>
            </div>
        </div>

        <div class="footer-right">
            <!-- Language Switcher -->
            <div style="position: relative;">
                <button class="footer-btn" id="langBtn" title="Language">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10"/>
                        <line x1="2" y1="12" x2="22" y2="12"/>
                        <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
                    </svg>
                </button>
                <div class="lang-dropdown" id="langDropdown">
                    <div class="lang-option selected" data-lang="en">
                        English
                        <svg class="check-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="20 6 9 17 4 12"/>
                        </svg>
                    </div>
                    <div class="lang-option" data-lang="zh">
                        中文
                        <svg class="check-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="20 6 9 17 4 12"/>
                        </svg>
                    </div>
                    <div class="lang-option" data-lang="es">
                        Espa&ntilde;ol
                        <svg class="check-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="20 6 9 17 4 12"/>
                        </svg>
                    </div>
                    <div class="lang-option" data-lang="pt">
                        Portugu&ecirc;s
                        <svg class="check-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="20 6 9 17 4 12"/>
                        </svg>
                    </div>
                    <div class="lang-option" data-lang="hi">
                        &#x0939;&#x093F;&#x0928;&#x094D;&#x0926;&#x0940;
                        <svg class="check-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="20 6 9 17 4 12"/>
                        </svg>
                    </div>
                    <div class="lang-option" data-lang="ja">
                        日本語
                        <svg class="check-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="20 6 9 17 4 12"/>
                        </svg>
                    </div>
                    <div class="lang-option" data-lang="ko">
                        한국어
                        <svg class="check-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="20 6 9 17 4 12"/>
                        </svg>
                    </div>
                    <div class="lang-option" data-lang="ru">
                        Русский
                        <svg class="check-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="20 6 9 17 4 12"/>
                        </svg>
                    </div>
                    <div class="lang-option" data-lang="vi">
                        Ti&#x1EBF;ng Vi&#x1EC7;t
                        <svg class="check-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="20 6 9 17 4 12"/>
                        </svg>
                    </div>
                    <div class="lang-option" data-lang="id">
                        Bahasa Indonesia
                        <svg class="check-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="20 6 9 17 4 12"/>
                        </svg>
                    </div>
                    <div class="lang-option" data-lang="ms">
                        Bahasa Melayu
                        <svg class="check-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="20 6 9 17 4 12"/>
                        </svg>
                    </div>
                </div>
            </div>

            <!-- Notification -->
            <button class="footer-btn" id="notifBtn" title="Notifications">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
                    <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
                </svg>
                <span class="notification-badge"></span>
            </button>

            <div class="footer-divider"></div>

            <!-- Discord -->
            <a href="#" class="footer-btn social-link" title="Discord" target="_blank">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke-width="0" >
                    <path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994a.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.095 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.095 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z" fill="rgba(255,255,255,0.7)"/>
                </svg>
            </a>

            <!-- X (Twitter) -->
            <a href="#" class="footer-btn social-link" title="X" target="_blank">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke-width="0">
                    <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z" fill="rgba(255,255,255,0.7)"/>
                </svg>
            </a>

            <!-- Gitbook -->
            <a href="#" class="footer-btn social-link" title="Gitbook" target="_blank">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke-width="0">
                    <path d="M10.802 17.77a.703.703 0 1 1-.002 1.406.703.703 0 0 1 .002-1.406m11.024-4.347a.703.703 0 1 1 .001-1.406.703.703 0 0 1-.001 1.406m0-2.876a2.176 2.176 0 0 0-2.174 2.174c0 .233.039.465.115.691l-7.181 3.823a2.165 2.165 0 0 0-1.784-.937c-.829 0-1.584.475-1.95 1.216l-6.451-3.402c-.682-.358-1.192-1.48-1.138-2.502.028-.533.212-.947.493-1.107.178-.1.392-.092.62.027l.042.023c1.71.9 7.304 3.847 7.54 3.956.363.168.565.237 1.185-.057l11.564-6.014c.17-.064.368-.227.368-.474 0-.342-.354-.477-.355-.477-.658-.315-1.669-.788-2.655-1.25-2.108-.987-4.497-2.105-5.546-2.655-.906-.474-1.635-.074-1.765.006l-.252.125C7.78 6.048 1.46 9.178 1.1 9.397.457 9.789.058 10.57.006 11.539c-.08 1.537.703 3.14 1.824 3.727l6.822 3.518a2.175 2.175 0 0 0 2.15 1.862 2.177 2.177 0 0 0 2.173-2.14l7.514-4.073c.38.298.853.461 1.337.461A2.176 2.176 0 0 0 24 12.72a2.176 2.176 0 0 0-2.174-2.174" fill="rgba(255,255,255,0.7)"/>
                </svg>
            </a>
        </div>
    </footer>

    <script>
        // Language dropdown toggle
        const langBtn = document.getElementById('langBtn');
        const langDropdown = document.getElementById('langDropdown');

        langBtn.addEventListener('click', function(e) {
            e.stopPropagation();
            langDropdown.classList.toggle('active');
        });

        // Language selection
        const langOptions = document.querySelectorAll('.lang-option');
        langOptions.forEach(option => {
            option.addEventListener('click', function() {
                langOptions.forEach(opt => opt.classList.remove('selected'));
                this.classList.add('selected');
                langDropdown.classList.remove('active');
            });
        });

        // Close dropdown when clicking outside
        document.addEventListener('click', function(e) {
            if (!langDropdown.contains(e.target) && e.target !== langBtn) {
                langDropdown.classList.remove('active');
            }
        });

        // Notification button interaction
        const notifBtn = document.getElementById('notifBtn');
        notifBtn.addEventListener('click', function() {
            const badge = this.querySelector('.notification-badge');
            if (badge) {
                badge.style.display = badge.style.display === 'none' ? 'block' : 'none';
            }
        });
    </script>
</body>
</html>
