<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Otter Trade - Ecosystem</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: #0B0B0B;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ===== HEADER ===== */
        .header {
            display: flex; align-items: center; justify-content: space-between;
            padding: 12px 24px; background: #0B0B0B;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            position: fixed; top: 0; left: 0; right: 0; z-index: 1000; height: 56px;
        }
        .header-left { display: flex; align-items: center; gap: 12px; }
        .header-logo { width: 32px; height: 32px; border-radius: 50%; }
        .header-brand { font-family: 'Orbitron', sans-serif; font-size: 13px; font-weight: 600; color: #F5B70A; letter-spacing: 0.05em; }
        .header-nav { display: flex; align-items: center; gap: 18px; }
        .nav-link { font-size: 11px; color: rgba(255,255,255,0.5); letter-spacing: 0.1em; text-transform: uppercase; padding: 6px 10px; text-decoration: none; transition: all 0.2s; border-bottom: 2px solid transparent; }
        .nav-link:hover { color: #F5B70A; }
        .nav-link.active { color: #F5B70A; border-bottom-color: #F5B70A; }
        .header-right { display: flex; align-items: center; gap: 14px; }
        .user-email { font-size: 12px; color: rgba(255,255,255,0.7); }
        .logout-btn { display: flex; align-items: center; justify-content: center; width: 30px; height: 30px; border: 1px solid rgba(255,255,255,0.1); background: transparent; cursor: pointer; transition: all 0.2s; }
        .logout-btn:hover { border-color: #F5B70A; background: rgba(245,183,10,0.1); }
        .logout-btn svg { width: 14px; height: 14px; stroke: rgba(255,255,255,0.7); }

        /* ===== FOOTER ===== */
        .footer {
            display: flex; align-items: center; justify-content: space-between;
            padding: 8px 24px; background: #0B0B0B;
            border-top: 1px solid rgba(255,255,255,0.1);
            position: fixed; bottom: 0; left: 0; right: 0; z-index: 1000; height: 40px;
        }
        .footer-left { display: flex; align-items: center; gap: 24px; }
        .crypto-item { display: flex; align-items: center; gap: 6px; font-size: 11px; }
        .crypto-pair { color: rgba(255,255,255,0.6); }
        .crypto-change.negative { color: #ef4444; }
        .crypto-change.positive { color: #22c55e; }
        .crypto-price { color: #fff; font-weight: 500; }
        .footer-right { display: flex; align-items: center; gap: 12px; }
        .footer-btn { background: none; border: none; cursor: pointer; color: rgba(255,255,255,0.5); transition: color 0.2s; font-size: 14px; }
        .footer-btn:hover { color: #F5B70A; }
        .footer-divider { width: 1px; height: 16px; background: rgba(255,255,255,0.15); }
        .social-link { color: rgba(255,255,255,0.4); text-decoration: none; font-size: 13px; transition: color 0.2s; }
        .social-link:hover { color: #F5B70A; }

        /* ===== MAIN CONTENT ===== */
        .main-content {
            flex: 1; margin-top: 56px; margin-bottom: 40px;
            overflow-y: auto; padding: 32px 32px 48px;
            max-width: 1200px; margin-left: auto; margin-right: auto; width: 100%;
        }

        /* ===== PAGE HEADER ===== */
        .page-head { margin-bottom: 24px; }
        .page-label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.12em; color: #F5B70A; font-weight: 600; margin-bottom: 6px; }
        .page-title { font-family: 'Orbitron', sans-serif; font-size: 28px; font-weight: 800; margin-bottom: 8px; }
        .page-sub { font-size: 13px; color: rgba(255,255,255,0.5); max-width: 640px; line-height: 1.6; }

        /* ===== TABS ===== */
        .tabs { display: flex; gap: 4px; border-bottom: 1px solid rgba(255,255,255,0.1); margin-bottom: 28px; }
        .tab {
            padding: 12px 22px; font-size: 13px; font-weight: 600; letter-spacing: 0.04em;
            color: rgba(255,255,255,0.5); background: none; border: none; cursor: pointer;
            border-bottom: 2px solid transparent; transition: all 0.2s; display: flex; align-items: center; gap: 8px;
        }
        .tab:hover { color: rgba(255,255,255,0.85); }
        .tab.active { color: #F5B70A; border-bottom-color: #F5B70A; }
        .tab-count { font-size: 11px; padding: 1px 8px; border-radius: 10px; background: rgba(255,255,255,0.08); color: rgba(255,255,255,0.6); }
        .tab.active .tab-count { background: rgba(245,183,10,0.15); color: #F5B70A; }

        .tab-panel { display: none; }
        .tab-panel.active { display: block; }

        /* ===== AMBASSADOR GRID ===== */
        .amb-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px; }
        .amb-card {
            border: 1px solid rgba(255,255,255,0.08); border-radius: 12px;
            padding: 24px 20px; background: rgba(255,255,255,0.02);
            display: flex; flex-direction: column; align-items: center; text-align: center;
            transition: all 0.2s;
        }
        .amb-card:hover { border-color: rgba(245,183,10,0.4); transform: translateY(-3px); background: rgba(245,183,10,0.03); }
        .amb-avatar {
            width: 72px; height: 72px; border-radius: 50%; margin-bottom: 14px;
            display: flex; align-items: center; justify-content: center;
            font-family: 'Orbitron', sans-serif; font-size: 26px; font-weight: 700; color: #0B0B0B;
            border: 2px solid rgba(245,183,10,0.5);
        }
        .amb-name { font-size: 16px; font-weight: 700; margin-bottom: 4px; }
        .amb-handle { font-size: 12px; color: rgba(255,255,255,0.45); margin-bottom: 16px; }
        .amb-socials { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
        .social-icon {
            width: 34px; height: 34px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.1);
            display: flex; align-items: center; justify-content: center;
            color: rgba(255,255,255,0.6); text-decoration: none; transition: all 0.2s;
        }
        .social-icon:hover { border-color: #F5B70A; color: #F5B70A; background: rgba(245,183,10,0.08); }
        .social-icon svg { width: 16px; height: 16px; }

        /* ===== SPONSOR GRID ===== */
        .spo-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
        .spo-card {
            border: 1px solid rgba(255,255,255,0.08); border-radius: 12px;
            padding: 24px; background: rgba(255,255,255,0.02); transition: all 0.2s;
        }
        .spo-card:hover { border-color: rgba(245,183,10,0.4); transform: translateY(-3px); background: rgba(245,183,10,0.03); }
        .spo-head { display: flex; align-items: center; gap: 14px; margin-bottom: 18px; }
        .spo-logo {
            width: 56px; height: 56px; border-radius: 12px; flex-shrink: 0;
            display: flex; align-items: center; justify-content: center;
            font-family: 'Orbitron', sans-serif; font-size: 20px; font-weight: 700; color: #fff;
        }
        .spo-name { font-size: 17px; font-weight: 700; margin-bottom: 3px; }
        .spo-cat { font-size: 11px; color: rgba(255,255,255,0.45); text-transform: uppercase; letter-spacing: 0.06em; }
        .spo-amount-box {
            border: 1px solid rgba(34,197,94,0.25); background: rgba(34,197,94,0.06);
            border-radius: 10px; padding: 14px 16px; margin-bottom: 18px;
            display: flex; align-items: center; justify-content: space-between;
        }
        .spo-amount-label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em; color: rgba(255,255,255,0.5); }
        .spo-amount-value { font-family: 'Orbitron', sans-serif; font-size: 22px; font-weight: 700; color: #22c55e; }
        .spo-socials { display: flex; gap: 8px; flex-wrap: wrap; }

        @media (max-width: 1000px) {
            .amb-grid { grid-template-columns: repeat(3, 1fr); }
            .spo-grid { grid-template-columns: repeat(2, 1fr); }
        }
        @media (max-width: 680px) {
            .amb-grid { grid-template-columns: repeat(2, 1fr); }
            .spo-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <!-- HEADER -->
    <header class="header">
        <div class="header-left">
            <img src="logo.png" alt="Otter Trade" class="header-logo">
            <span class="header-brand">OTTER TRADE</span>
        </div>
        <nav class="header-nav">
            <a href="dashboard.html" class="nav-link">ARENA</a>
            <a href="competitions.html" class="nav-link">COMPETITIONS</a>
            <a href="watch-live.html" class="nav-link">WATCH LIVE</a>
            <a href="dashboard-new.html" class="nav-link">DASHBOARD</a>
            <a href="rewards.html" class="nav-link">REWARDS</a>

        <div class="header-right">

            <button class="logout-btn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16,17 21,12 16,7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>

    <!-- MAIN CONTENT -->
    <main class="main-content">

        <!-- ===== AMBASSADOR PANEL ===== -->
        <div class="tab-panel active" id="ambassador">

        <!-- ===== SPONSOR PANEL ===== -->
        <div class="tab-panel" id="sponsor">
            <div class="spo-grid" id="spoGrid"></div>
        </div>
    </main>

    <!-- FOOTER -->
    <footer class="footer">
        <div class="footer-left">
            <div class="crypto-item"><span class="crypto-pair">BTCUSDT</span><span class="crypto-change negative">-8.83%</span><span class="crypto-price">62,640.0</span></div>
            <div class="crypto-item"><span class="crypto-pair">ETHUSDT</span><span class="crypto-change negative">-5.21%</span><span class="crypto-price">2,418.5</span></div>
            <div class="crypto-item"><span class="crypto-pair">SOLUSDT</span><span class="crypto-change positive">+2.14%</span><span class="crypto-price">66.58</span></div>
        </div>
        <div class="footer-right">
            <button class="footer-btn" id="langBtn">EN</button>
            <button class="footer-btn"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 01-3.46 0"/></svg></button>
            <span class="footer-divider"></span>
            <a href="#" class="social-link" title="Discord"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M20.317 4.37a19.791 19.791 0 00-4.885-1.515.074.074 0 00-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 00-5.487 0 12.64 12.64 0 00-.617-1.25.077.077 0 00-.079-.037A19.736 19.736 0 003.677 4.37a.07.07 0 00-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 00.031.057 19.9 19.9 0 005.993 3.03.078.078 0 00.084-.028c.462-.63.874-1.295 1.226-1.994a.076.076 0 00-.041-.106 13.107 13.107 0 01-1.872-.892.077.077 0 01-.008-.128 10.2 10.2 0 00.372-.292.074.074 0 01.077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 01.078.01c.12.098.246.198.373.292a.077.077 0 01-.006.127 12.299 12.299 0 01-1.873.892.077.077 0 00-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 00.084.028 19.839 19.839 0 006.002-3.03.077.077 0 00.032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 00-.031-.03z"/></svg></a>
            <a href="#" class="social-link" title="X"><svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg></a>
        </div>
    </footer>

    <script>
        // ===== ICON SVGS =====
        const ICONS = {
            twitter: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>',
            telegram: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M11.944 0A12 12 0 000 12a12 12 0 0012 12 12 12 0 0012-12A12 12 0 0012 0a12 12 0 00-.056 0zm4.962 7.224c.1-.002.321.023.465.14a.506.506 0 01.171.325c.016.093.036.306.02.472-.18 1.898-.962 6.502-1.36 8.627-.168.9-.499 1.201-.82 1.23-.696.065-1.225-.46-1.9-.902-1.056-.693-1.653-1.124-2.678-1.8-1.185-.78-.417-1.21.258-1.91.177-.184 3.247-2.977 3.307-3.23.007-.032.014-.15-.056-.212s-.174-.041-.249-.024c-.106.024-1.793 1.14-5.061 3.345-.479.329-.913.489-1.302.481-.428-.009-1.252-.242-1.865-.44-.752-.244-1.349-.374-1.297-.789.027-.216.325-.437.893-.663 3.498-1.524 5.83-2.529 6.998-3.015 3.332-1.386 4.025-1.627 4.476-1.635z"/></svg>',
            discord: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M20.317 4.37a19.791 19.791 0 00-4.885-1.515.074.074 0 00-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 00-5.487 0 12.64 12.64 0 00-.617-1.25.077.077 0 00-.079-.037A19.736 19.736 0 003.677 4.37a.07.07 0 00-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 00.031.057 19.9 19.9 0 005.993 3.03.078.078 0 00.084-.028c.462-.63.874-1.295 1.226-1.994a.076.076 0 00-.041-.106 13.107 13.107 0 01-1.872-.892.077.077 0 01-.008-.128 10.2 10.2 0 00.372-.292.074.074 0 01.077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 01.078.01c.12.098.246.198.373.292a.077.077 0 01-.006.127 12.299 12.299 0 01-1.873.892.077.077 0 00-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 00.084.028 19.839 19.839 0 006.002-3.03.077.077 0 00.032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 00-.031-.03zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z"/></svg>',
            youtube: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M23.498 6.186a3.016 3.016 0 00-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 00.502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 002.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 002.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/></svg>',
            website: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 014 10 15.3 15.3 0 01-4 10 15.3 15.3 0 01-4-10 15.3 15.3 0 014-10z"/></svg>',
            instagram: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"/><path d="M16 11.37A4 4 0 1112.63 8 4 4 0 0116 11.37z"/><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"/></svg>'
        };

        function socialIcon(type, url) {
            return `<a href="${url}" target="_blank" class="social-icon" title="${type}">${ICONS[type]}</a>`;
        }

        // ===== AMBASSADOR DATA =====
        const ambassadors = [
            { name: 'CryptoKing', handle: '@cryptoking', color: '#F5B70A', socials: { twitter:'#', telegram:'#', youtube:'#' } },
            { name: 'TradeMaster', handle: '@trademaster', color: '#6c5ce7', socials: { twitter:'#', discord:'#', telegram:'#' } },
            { name: 'AlphaWolf', handle: '@alphawolf', color: '#00cec9', socials: { twitter:'#', youtube:'#', instagram:'#' } },
            { name: 'MoonShot', handle: '@moonshot', color: '#fd79a8', socials: { twitter:'#', telegram:'#' } },
            { name: 'DeFiQueen', handle: '@defiqueen', color: '#fdcb6e', socials: { twitter:'#', telegram:'#', discord:'#', youtube:'#' } },
            { name: 'ChartWizard', handle: '@chartwizard', color: '#55efc4', socials: { twitter:'#', youtube:'#' } },
            { name: 'BullRunner', handle: '@bullrunner', color: '#74b9ff', socials: { twitter:'#', telegram:'#', instagram:'#' } },
            { name: 'SatoshiFan', handle: '@satoshifan', color: '#a29bfe', socials: { twitter:'#', discord:'#', telegram:'#' } }
        ];

        // ===== SPONSOR DATA =====
        const sponsors = [
            { name: 'BitX Exchange', cat: 'Crypto Exchange', logo:'BX', color:'linear-gradient(135deg,#6c5ce7,#a29bfe)', total:'$125,000', socials:{ website:'#', twitter:'#', telegram:'#', discord:'#' } },
            { name: 'NovaChain', cat: 'Layer 1 Protocol', logo:'NC', color:'linear-gradient(135deg,#00cec9,#55efc4)', total:'$98,500', socials:{ website:'#', twitter:'#', discord:'#', youtube:'#' } },
            { name: 'QuantumPay', cat: 'Payment Network', logo:'QP', color:'linear-gradient(135deg,#fd79a8,#fdcb6e)', total:'$76,200', socials:{ website:'#', twitter:'#', telegram:'#' } },
            { name: 'HyperDEX', cat: 'Decentralized Exchange', logo:'HD', color:'linear-gradient(135deg,#0984e3,#74b9ff)', total:'$54,800', socials:{ website:'#', twitter:'#', telegram:'#', discord:'#', youtube:'#' } },
            { name: 'StableVault', cat: 'Stablecoin Protocol', logo:'SV', color:'linear-gradient(135deg,#00b894,#55efc4)', total:'$41,000', socials:{ website:'#', twitter:'#', telegram:'#' } },
            { name: 'MetaForge', cat: 'GameFi Studio', logo:'MF', color:'linear-gradient(135deg,#e17055,#fab1a0)', total:'$33,750', socials:{ website:'#', twitter:'#', discord:'#', instagram:'#' } }
        ];

        // ===== RENDER AMBASSADORS =====
        const ambGrid = document.getElementById('ambGrid');
        ambGrid.innerHTML = ambassadors.map(a => {
            const initials = a.name.replace(/[^A-Z]/g,'').slice(0,2) || a.name.slice(0,2).toUpperCase();
            const socials = Object.entries(a.socials).map(([t,u]) => socialIcon(t,u)).join('');
            return `<div class="amb-card">
                <div class="amb-avatar" style="background:${a.color};">${initials}</div>
                <div class="amb-name">${a.name}</div>
                <div class="amb-handle">${a.handle}</div>
                <div class="amb-socials">${socials}</div>
            </div>`;
        }).join('');

        // ===== RENDER SPONSORS =====
        const spoGrid = document.getElementById('spoGrid');
        spoGrid.innerHTML = sponsors.map(s => {
            const socials = Object.entries(s.socials).map(([t,u]) => socialIcon(t,u)).join('');
            return `<div class="spo-card">
                <div class="spo-head">
                    <div class="spo-logo" style="background:${s.color};">${s.logo}</div>
                    <div>
                        <div class="spo-name">${s.name}</div>
                        <div class="spo-cat">${s.cat}</div>
                    </div>
                </div>
                <div class="spo-amount-box">
                    <span class="spo-amount-label">Total Sponsored</span>
                    <span class="spo-amount-value">${s.total}</span>
                </div>
                <div class="spo-socials">${socials}</div>
            </div>`;
        }).join('');

        // ===== TAB SWITCHING =====
        document.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
                tab.classList.add('active');
                document.getElementById(tab.dataset.tab).classList.add('active');
            });
        });
    </script>
</body>
</html>
